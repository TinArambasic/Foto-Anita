<!-- Gallery page template — copy and customise per gallery -->
<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kristiana & Miroslav — Foto Anita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300;0,400;1,300&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #0C0A09; color: #F5EFE6; font-family: 'Jost', sans-serif; font-weight: 300; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #C9A96E; border-radius: 3px; }
    ::selection { background: rgba(201,169,110,.35); }

    /* Back bar */
    .topbar {
      position: sticky; top: 0; z-index: 40;
      padding: 1.1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(12,10,9,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(201,169,110,.15);
    }
    .back-link {
      display: inline-flex; align-items: center; gap: .6rem;
      font-size: .7rem; letter-spacing: .18em; text-transform: uppercase;
      color: #C9A96E; text-decoration: none;
      transition: color .2s;
    }
    .back-link:hover { color: #DEC99A; }
    .brand {
      font-family: 'Great Vibes', cursive;
      font-size: 1.7rem; color: #C9A96E;
      text-decoration: none;
    }

    /* Hero */
    .gal-hero {
      padding: 6rem 2rem 4rem;
      text-align: center;
      background: linear-gradient(to bottom, #171412, #0C0A09);
    }
    .gal-eyebrow {
      font-size: .68rem; letter-spacing: .3em; text-transform: uppercase;
      color: #C9A96E; margin-bottom: 1rem;
    }
    .gal-title {
      font-family: 'Cormorant Infant', serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 300; line-height: 1.1; color: #F5EFE6;
      margin-bottom: .6rem;
    }
    .gal-title em { font-style: italic; color: #C9A96E; }
    .gal-meta {
      font-family: 'Cormorant Infant', serif;
      font-size: 1.05rem; color: #A89888; font-style: italic;
    }

    /* Grid */
    .photo-grid {
      max-width: 1200px; margin: 3rem auto 6rem;
      padding: 0 2rem;
      columns: 4; column-gap: 10px;
    }
    .photo-item {
      break-inside: avoid; margin-bottom: 10px;
      position: relative; overflow: hidden; cursor: pointer;
    }
    .photo-item img {
      width: 100%; display: block;
      filter: sepia(12%) saturate(.88) contrast(1.06);
      transition: transform .5s ease, filter .4s;
    }
    .photo-item:hover img { transform: scale(1.04); filter: sepia(4%) saturate(1) contrast(1.04); }
    .photo-item-overlay {
      position: absolute; inset: 0;
      background: rgba(12,10,9,0);
      display: flex; align-items: center; justify-content: center;
      transition: background .3s;
    }
    .photo-item:hover .photo-item-overlay { background: rgba(12,10,9,.28); }
    .photo-item-overlay svg { opacity: 0; transform: scale(.7); transition: opacity .3s, transform .3s; color: #F5EFE6; }
    .photo-item:hover .photo-item-overlay svg { opacity: 1; transform: scale(1); }

    /* Lightbox */
    #lb { position: fixed; inset: 0; z-index: 100; background: rgba(8,6,5,.97); display: none; align-items: center; justify-content: center; padding: 2rem; }
    #lb.open { display: flex; }
    #lb img { max-width: 90vw; max-height: 90vh; object-fit: contain; box-shadow: 0 40px 100px rgba(0,0,0,.7); }
    .lb-btn { position: absolute; width: 44px; height: 44px; border: 1px solid rgba(201,169,110,.35); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #C9A96E; background: transparent; transition: background .25s, border-color .25s; }
    .lb-btn:hover { background: #C9A96E; color: #0C0A09; border-color: #C9A96E; }
    #lb-close { top: 1.5rem; right: 1.5rem; }
    #lb-prev { left: 1.5rem; top: 50%; transform: translateY(-50%); }
    #lb-next { right: 1.5rem; top: 50%; transform: translateY(-50%); }

    @media (max-width: 768px) { .photo-grid { columns: 2; } }
    @media (max-width: 480px) { .photo-grid { columns: 1; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="../index.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 12H5M12 19l-7-7 7-7"/></svg>
      Natrag
    </a>
    <a href="../index.html" class="brand">Foto Anita</a>
    <a href="../index.html#contact" style="font-family:'Jost',sans-serif; font-size:.68rem; letter-spacing:.2em; text-transform:uppercase; color:#0C0A09; background:#C9A96E; padding:.55rem 1.2rem; text-decoration:none; cursor:pointer; transition:background .25s;" onmouseover="this.style.background='#DEC99A'" onmouseout="this.style.background='#C9A96E'">Rezerviraj</a>
  </header>

  <div class="gal-hero">
    <p class="gal-eyebrow">Vjenčanje</p>
    <h1 class="gal-title">Kristiana <em>&amp;</em> Miroslav</h1>
    <p class="gal-meta">44 fotografija</p>
  </div>

  <div class="photo-grid" id="photo-grid">
    <!-- Photos — replace src with real images -->
    <!-- Pattern: vary aspect ratios for masonry rhythm -->
  </div>

  <!-- Lightbox -->
  <div id="lb" role="dialog" aria-modal="true" aria-label="Pregled fotografije">
    <button id="lb-close" class="lb-btn" aria-label="Zatvori">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <button id="lb-prev" class="lb-btn" aria-label="Prethodna">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <img id="lb-img" src="" alt="" />
    <button id="lb-next" class="lb-btn" aria-label="Sljedeća">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <script>
    // Auto-build grid from photo array — replace with real paths
    const photos = [

      { src: 'slike/kristiana-miroslav/02.jpg', alt: 'Kristiana & Miroslav — fotografija 2' },

      { src: 'slike/kristiana-miroslav/43.jpg', alt: 'Kristiana & Miroslav — fotografija 43' },
      { src: 'slike/kristiana-miroslav/44.jpg', alt: 'Kristiana & Miroslav — fotografija 44' },
    ];

    const grid = document.getElementById('photo-grid');
    const lb   = document.getElementById('lb');
    const lbImg = document.getElementById('lb-img');
    let lbCur = 0;

    photos.forEach((p, i) => {
      const item = document.createElement('div');
      item.className = 'photo-item';
      item.innerHTML = `
        <img src="${p.src}" alt="${p.alt}" loading="lazy" />
        <div class="photo-item-overlay">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M11 8v6M8 11h6"/></svg>
        </div>`;
      item.addEventListener('click', () => { lbCur = i; openLb(); });
      grid.appendChild(item);
    });

    function openLb() { lbImg.src = photos[lbCur].src; lbImg.alt = photos[lbCur].alt; lb.classList.add('open'); document.body.style.overflow='hidden'; }
    function closeLb() { lb.classList.remove('open'); document.body.style.overflow=''; }

    document.getElementById('lb-close').addEventListener('click', closeLb);
    document.getElementById('lb-prev').addEventListener('click', () => { lbCur = (lbCur - 1 + photos.length) % photos.length; lbImg.src = photos[lbCur].src; lbImg.alt = photos[lbCur].alt; });
    document.getElementById('lb-next').addEventListener('click', () => { lbCur = (lbCur + 1) % photos.length; lbImg.src = photos[lbCur].src; lbImg.alt = photos[lbCur].alt; });
    lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLb();
      if (e.key === 'ArrowLeft') document.getElementById('lb-prev').click();
      if (e.key === 'ArrowRight') document.getElementById('lb-next').click();
    });
  </script>
</body>
